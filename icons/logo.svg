<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 186 412 232">
  <title>Bharat Impex</title>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F6F8"/>
      <stop offset="0.35" stop-color="#B9C0C8"/>
      <stop offset="0.55" stop-color="#E9ECEF"/>
      <stop offset="0.8" stop-color="#8E959D"/>
      <stop offset="1" stop-color="#CDD2D7"/>
    </linearGradient>
    <linearGradient id="steelSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C838B"/>
      <stop offset="1" stop-color="#4D535A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FE8FF"/>
      <stop offset="0.45" stop-color="#1E9BFF"/>
      <stop offset="1" stop-color="#0A5BD6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- outer steel arch: side face then front face -->
    <path d="M70 392 A186 186 0 0 1 442 392 L404 392 A148 148 0 0 0 108 392 Z" fill="url(#steelSide)" transform="translate(10 8)"/>
    <path d="M70 392 A186 186 0 0 1 442 392 L404 392 A148 148 0 0 0 108 392 Z" fill="url(#steel)"/>
    <!-- middle steel arch -->
    <path d="M124 392 A132 132 0 0 1 388 392 L356 392 A100 100 0 0 0 156 392 Z" fill="url(#steelSide)" transform="translate(8 7)"/>
    <path d="M124 392 A132 132 0 0 1 388 392 L356 392 A100 100 0 0 0 156 392 Z" fill="url(#steel)"/>
    <!-- glowing blue core arch -->
    <path d="M176 392 A80 80 0 0 1 336 392 L306 392 A50 50 0 0 0 206 392 Z" fill="url(#blue)" filter="url(#glow)"/>
    <path d="M184 352 A72 72 0 0 1 300 336" fill="none" stroke="#C9FAFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <!-- brushed highlights on steel -->
    <path d="M96 300 A168 168 0 0 1 296 228" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M150 322 A116 116 0 0 1 286 280" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
